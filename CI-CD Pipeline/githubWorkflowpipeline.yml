# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on: #trigger point
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: # collection of jobs
  build: #job1
    name: Build and Test
    runs-on: ubuntu-latest # worker node - worker managed by github
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps: # series of tasks, which will be executed in this job1
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html

    - name: Read Test Coverage Report
      run: | 
        ls
        cat coverage.xml

    - name: Upload Coverage to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.xml

  sonarqube-scanner: #job2
    name: SonarQube Scanner
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Download Coverage Report From Artifact
        uses: actions/download-artifact@v8
        with:
         name: coverage-report
      
      - name: Read Test Coverage Report
        run: | 
          ls
          cat coverage.xml

      - uses: SonarSource/sonarqube-scan-action@v8.1.0 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
        
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

