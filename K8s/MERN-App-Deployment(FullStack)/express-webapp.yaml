apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    dc: mumbai
    proj: mern-proj
    app: webapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      name: webapp
      labels:
        app: webapp
    spec:
      containers:
      - name: mongo-express
        image: mongo-express
        ports:
        - containerPort: 8081
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME 
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: mongodb-user

          - name: ME_CONFIG_MONGODB_ADMINPASSWORD 
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: mongodb-pass

          - name: ME_CONFIG_MONGODB_SERVER
            valueFrom:
              configMapKeyRef:
                name: mongo-service-configmap
                key:  mongodb-service-url