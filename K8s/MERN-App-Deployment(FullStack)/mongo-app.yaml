apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-app-deployment
  labels:
    app: mongodb
    region: delhi
    proj: k8s-practical1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      name: mongdb
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo
        ports:
          - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: mongodb-user

          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: mongodb-pass